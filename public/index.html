<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Component Gallery</title>
    <script>
      // Pick a locale from the browser, defaulting to Korean, then redirect.
      (function () {
        var lang = (navigator.language || "ko").toLowerCase();
        var locale = lang.indexOf("ko") === 0 ? "ko" : "en";
        location.replace("/" + locale + "/");
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/ko/" />
  </head>
  <body>
    <p>Redirecting… <a href="/ko/">컴포넌트 갤러리로 이동</a></p>
  </body>
</html>
